<!-- Confirm signup email. Paste into Supabase Dashboard > Authentication > Emails > Confirm sign up
     (this repo has no supabase/config.toml, so the dashboard is where it lives).
     Colors are the web/app/globals.css tokens converted from oklch to hex, because email clients
     do not parse oklch: background #010101, card #040404, foreground #ece7e1, primary #d09945,
     muted-foreground #70685c, border 8% white ~ #151515. Radius 0.375rem = 6px. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Confirm your email</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;padding:0;background-color:#010101;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#010101;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding:0 0 24px;font-family:'Cinzel',Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#d09945;">
                Buy-In
              </td>
            </tr>
            <tr>
              <td style="background-color:#040404;border:1px solid #151515;border-radius:6px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#ece7e1;">
                <h1 style="margin:0 0 12px;font-family:'Cinzel',Georgia,'Times New Roman',serif;font-size:22px;font-weight:500;line-height:1.3;color:#ece7e1;">
                  Confirm your email
                </h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#ece7e1;">
                  One tap and your account is ready. Confirm this address to sign in to Buy-In.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
                  <tr>
                    <td align="center" bgcolor="#d09945" style="border-radius:6px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#010101;text-decoration:none;border-radius:6px;">
                        Confirm email
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:#70685c;">
                  Button not working? Paste this link into your browser:
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;word-break:break-all;">
                  <a href="{{ .ConfirmationURL }}" style="color:#d09945;text-decoration:underline;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#70685c;">
                Sent to {{ .Email }}. If you didn't create a Buy-In account, ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
